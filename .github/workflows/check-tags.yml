name: Check Docker Hub Tags

on:
  workflow_dispatch:

jobs:
  check-tags:
    runs-on: ubuntu-latest
    steps:
      - name: Login to Docker Hub (skopeo)
        run: |
          skopeo login docker.io \
            --username "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Query Docker Hub tags
        run: |
          {
            echo "## Docker Hub — Latest Tags"
            echo ""
            echo "### chatwoot"
            echo "| Latest Tag | Version |"
            echo "|------------|---------|"

            ALL_TAGS=$(skopeo list-tags "docker://docker.io/idiomusdocker/chatwoot" | jq -r '.Tags[]')

            LATEST=$(echo "$ALL_TAGS" | grep -E "^[0-9]+\.[0-9]+\.[0-9]+$" \
              | sort -t. -k1,1n -k2,2n -k3,3n \
              | tail -1)

            if [ -n "$LATEST" ]; then
              echo "| ${LATEST} | ${LATEST} |"
            else
              echo "| — | — |"
            fi

            has_staging=$(echo "$ALL_TAGS" | grep -c "^staging$" || true)
            if [ "$has_staging" -gt 0 ]; then
              echo "| staging | — |"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
