name: Build App Image

on:
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment"
        required: true
        type: choice
        options:
          - production
          - staging
      version:
        description: "Version (e.g. 1.0.0)"
        required: true
        type: string
      push_latest:
        description: "Tag as latest"
        required: false
        type: boolean
        default: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve build parameters
        id: params
        run: |
          if [ "${{ inputs.environment }}" = "production" ]; then
            echo "image_tag=${{ inputs.version }}" >> "$GITHUB_OUTPUT"
            echo "latest_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=staging" >> "$GITHUB_OUTPUT"
            echo "latest_tag=" >> "$GITHUB_OUTPUT"
          fi

      - name: Login to Docker Hub (skopeo)
        run: |
          skopeo login docker.io \
            --username "${{ secrets.DOCKERHUB_USERNAME }}" \
            --password "${{ secrets.DOCKERHUB_TOKEN }}"

      - name: Fetch latest tag from Docker Hub
        run: |
          ALL_TAGS=$(skopeo list-tags "docker://docker.io/idiomusdocker/chatwoot" | jq -r '.Tags[]')

          if [ "${{ inputs.environment }}" = "production" ]; then
            LATEST=$(echo "$ALL_TAGS" | grep -E "^[0-9]+\.[0-9]+\.[0-9]+$" \
              | sort -t. -k1,1n -k2,2n -k3,3n \
              | tail -1)
            echo "### chatwoot — Current latest: \`${LATEST:-none}\`" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### chatwoot — Staging build (replaces \`staging\` tag)" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Validate version
        if: inputs.environment == 'production'
        run: |
          VERSION="${{ inputs.version }}"
          ALL_TAGS=$(skopeo list-tags "docker://docker.io/idiomusdocker/chatwoot" | jq -r '.Tags[]')

          if echo "$ALL_TAGS" | grep -qx "$VERSION"; then
            echo "::error::Tag '${VERSION}' already exists on Docker Hub. Choose a different version."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Determine tags
        id: tags
        run: |
          IMAGE="idiomusdocker/chatwoot"
          TAGS="${IMAGE}:${{ steps.params.outputs.image_tag }}"

          if [ "${{ inputs.environment }}" = "production" ] && [ "${{ inputs.push_latest }}" = "true" ]; then
            TAGS="${TAGS},${IMAGE}:${{ steps.params.outputs.latest_tag }}"
          fi

          echo "tags=${TAGS}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./docker/Dockerfile
          push: true
          platforms: linux/amd64
          no-cache: true
          tags: ${{ steps.tags.outputs.tags }}

      - name: Summary
        run: |
          {
            echo ""
            echo "### Build Complete"
            echo "| Field | Value |"
            echo "|-------|-------|"
            echo "| Image | \`idiomusdocker/chatwoot\` |"
            echo "| Tags | \`${{ steps.tags.outputs.tags }}\` |"
            echo "| Branch | \`${{ github.ref_name }}\` |"
            echo "| Environment | \`${{ inputs.environment }}\` |"
          } >> "$GITHUB_STEP_SUMMARY"
